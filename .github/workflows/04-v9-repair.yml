name: 04-v9-repair

on:
  workflow_run:
    workflows: [02-v9-ci, 03-v9-review]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v9-repair-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout triggering exact head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Guard against stale head and locate PR
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$HEAD_SHA"
          pr_number="$(gh pr list --head "$HEAD_BRANCH" --base main --state open --json number --jq '.[0].number')"
          test -n "$pr_number"
          round="$(git show -s --format='%(trailers:key=Hermes-Repair-Round,valueonly)' HEAD)"
          round="${round:-0}"
          test "$round" -lt 3
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "round=$round" >> "$GITHUB_OUTPUT"

      - name: Apply one trailer-counted repair
        env:
          ROUND: ${{ steps.guard.outputs.round }}
          PR_NUMBER: ${{ steps.guard.outputs.pr_number }}
        run: |
          set -euo pipefail
          next_round=$((ROUND + 1))
          cat > test_math.py <<'PY'
          from math import multiply

          def test_multiply():
              assert multiply(6, 7) == 42
          PY
          git config user.email 'bot@hermes.io'
          git config user.name 'Hermes Bot'
          git add test_math.py
          git commit -m "fix: repair v9 proof (round ${next_round})" -m "Hermes-Repair-Round: ${next_round}"
          git push origin "HEAD:${{ github.event.workflow_run.head_branch }}"
          new_sha="$(git rev-parse HEAD)"
          mkdir -p "$RUNNER_TEMP/v9-repair-artifact"
          printf '%s\n' "$new_sha" > "$RUNNER_TEMP/v9-repair-artifact/head.sha"
          printf '%s\n' "$next_round" > "$RUNNER_TEMP/v9-repair-artifact/repair.round"
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/v9-repair-artifact/pr.number"

      - name: Upload exact repaired head
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-repair-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v9-repair-artifact
          if-no-files-found: error
