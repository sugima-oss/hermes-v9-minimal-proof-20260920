name: 01-v9-implement

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: v9-implement
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      HERMES_REF: 59f9ff8dbc75b9c4f07ae10174df730f7882a505
    steps:
      - name: Checkout workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Hermes ephemerally
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_HOME="$RUNNER_TEMP/hermes-home-$GITHUB_RUN_ID"
          mkdir -p "$HERMES_HOME"
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git "$HERMES_HOME/hermes-agent"
          git -C "$HERMES_HOME/hermes-agent" checkout --detach "$HERMES_REF"
          python3 -m venv "$HERMES_HOME/venv"
          "$HERMES_HOME/venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -e "$HERMES_HOME/hermes-agent"
          "$HERMES_HOME/venv/bin/hermes" --version

      - name: Create implementation branch and exact-head artifact
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="v9-proof/${GITHUB_RUN_ID}"
          git config user.email 'bot@hermes.io'
          git config user.name 'Hermes Bot'
          git switch --create "$branch"
          cat > math.py <<'PY'
          def multiply(a, b):
              return a * b
          PY
          cat > test_math.py <<'PY'
          from math import multiply

          def test_multiply():
              assert multiply(6, 7) == 42
          PY
          git add math.py test_math.py
          git commit -m 'feat: implement multiply proof'
          git push --set-upstream origin "$branch"
          head_sha="$(git rev-parse HEAD)"
          pr_url="$(gh pr create --base main --head "$branch" --title 'v9 minimal proof' --body "Automated v9 proof run ${GITHUB_RUN_ID}. Exact head: ${head_sha}")"
          pr_number="$(gh pr view "$pr_url" --json number --jq .number)"
          mkdir -p "$RUNNER_TEMP/v9-artifact"
          printf '%s\n' "$head_sha" > "$RUNNER_TEMP/v9-artifact/head.sha"
          printf '%s\n' "$branch" > "$RUNNER_TEMP/v9-artifact/head.branch"
          printf '%s\n' "$pr_number" > "$RUNNER_TEMP/v9-artifact/pr.number"
          printf '%s\n' "$HERMES_REF" > "$RUNNER_TEMP/v9-artifact/hermes.sha"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Upload exact implementation head
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-implement-${{ steps.create.outputs.head_sha }}
          path: ${{ runner.temp }}/v9-artifact
          if-no-files-found: error

      - name: Request API auto-merge
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.create.outputs.pr_number }}" --auto --squash --delete-branch
