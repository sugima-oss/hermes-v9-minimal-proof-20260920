name: 02-v9-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: V9-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate target before code
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ inputs.pr_number || github.event.pull_request.number }}
          SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,re,urllib.request
          event,repo,pr,sha=os.environ['EVENT'],os.environ['REPO'],os.environ['PR'],os.environ['SHA']
          if event == 'workflow_dispatch':
            if not pr.isdigit() or not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('invalid dispatch inputs')
            q=urllib.request.Request(f'https://api.github.com/repos/{repo}/pulls/{pr}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(q) as r: p=json.load(r)
            base,head,headrepo=p['base']['ref'],p['head']['ref'],p['head']['repo']['full_name']
            if p['head']['sha'] != sha: raise SystemExit('dispatch SHA is not PR head')
          else: base,head,headrepo=os.environ['BASE'],os.environ['HEAD'],os.environ['HEAD_REPO']
          if base and base != 'main': raise SystemExit('base must be main')
          if head and not re.fullmatch(r'v9-proof/[^/]+',head): raise SystemExit('non-canonical head branch')
          if headrepo and headrepo.lower() != repo.lower(): raise SystemExit('repository mismatch')
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('invalid target SHA')
          open(os.environ['GITHUB_OUTPUT'],'a').write(f'target_sha={sha}\npr_number={pr}\n')
          PY
      - name: Checkout exact target SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.target.outputs.target_sha }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest==8.3.4
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ steps.target.outputs.target_sha }}"
      - name: Run proof tests
        run: python3 -m pytest -q
      - name: Write exact-head evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/v9-ci-artifact"
          git rev-parse HEAD > "$RUNNER_TEMP/v9-ci-artifact/head.sha"
          printf '%s\n' "${{ steps.target.outputs.pr_number }}" > "$RUNNER_TEMP/v9-ci-artifact/pr.number"
          printf '%s\n' "${{ github.run_id }}" > "$RUNNER_TEMP/v9-ci-artifact/run.id"
      - name: Upload exact CI head
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-ci-${{ steps.target.outputs.target_sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v9-ci-artifact
          if-no-files-found: error
