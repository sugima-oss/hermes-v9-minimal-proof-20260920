name: 02-v9-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: V9-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@0b93645e5eda7314ede5160350410787e9140401
        with:
          python-version: 3.11

      - name: Install pytest
        run: pip install pytest==8.3.4

      - name: Run proof tests
        run: python3 -m pytest -q

      - name: Write exact-head evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v9-ci-artifact"
          git rev-parse HEAD > "$RUNNER_TEMP/v9-ci-artifact/head.sha"
          printf '%s\n' "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/v9-ci-artifact/pr.number"
          printf '%s\n' "${{ github.run_id }}" > "$RUNNER_TEMP/v9-ci-artifact/run.id"

      - name: Upload exact CI head
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-ci-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v9-ci-artifact
          if-no-files-found: error
