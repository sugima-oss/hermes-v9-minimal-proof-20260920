name: 03-v9-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: V9-codex-review
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Require review credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY"

      - name: Run official Codex review
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af
        with:
          prompt: >-
            Review this pull request at the exact checked-out HEAD. Inspect the
            implementation and tests. Respond with exactly PASS only when the
            implementation is correct and tests are adequate; otherwise respond
            with FAIL and concise repair instructions.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Write exact-head evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v9-review-artifact"
          git rev-parse HEAD > "$RUNNER_TEMP/v9-review-artifact/head.sha"
          printf '%s\n' "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/v9-review-artifact/pr.number"
          printf '%s\n' "${{ github.run_id }}" > "$RUNNER_TEMP/v9-review-artifact/run.id"

      - name: Upload exact review head
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-review-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/v9-review-artifact
          if-no-files-found: error

      - name: Request API auto-merge after review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --delete-branch
